[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictcli"
version = "0.5.1"
description = "Cambridge Dictionary in your terminal - definitions, examples, audio, offline cache and wordlists"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HarvyLiu" }]
requires-python = ">=3.10"
keywords = ["dictionary", "cli", "cambridge", "vocabulary", "english"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
    "platformdirs>=4.0",
    "questionary>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dict = "dictcli.cli:main"

[project.urls]
Repository = "https://github.com/HarvyLiu/dictionaryCLI"
Issues = "https://github.com/HarvyLiu/dictionaryCLI/issues"

[tool.setuptools.packages.find]
include = ["dictcli*"]
