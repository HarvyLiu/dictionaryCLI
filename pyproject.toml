[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictcli"
version = "0.1.0"
description = "Cambridge Dictionary in your terminal"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dict = "dictcli.cli:main"

[tool.setuptools.packages.find]
include = ["dictcli*"]
